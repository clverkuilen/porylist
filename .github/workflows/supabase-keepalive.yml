name: Supabase keep-alive

on:
  schedule:
    # Runs daily at 09:00 UTC — Supabase's pause detector wants a few DB
    # requests each day over the trailing week, not just one every few days
    - cron: "0 9 * * *"
  workflow_dispatch: # allow manual runs from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ping Supabase database
        run: |
          npm install --no-save @supabase/supabase-js@latest 2>/dev/null
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const supabase = createClient(
            'https://gkwaaznwbwuidfpczyel.supabase.co',
            'sb_publishable_-xAWajsU4z8xx3xqHXa87g_YaC9_rLo'
          );
          supabase
            .from('caught_pokemon')
            .select('user_id', { count: 'exact', head: true })
            .then(({ error, count }) => {
              if (error) {
                console.error('Query failed:', JSON.stringify(error));
                process.exit(1);
              }
              console.log('Ping successful, row count:', count);
            })
            .catch(e => { console.error(e); process.exit(1); });
          "
